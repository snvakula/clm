[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clm"
version = "0.1.0"
description = "Self-hosted certificate lifecycle management"
requires-python = ">=3.11"
dependencies = ["cryptography==48.0.0", "PyYAML==6.0.3", "idna==3.15"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
