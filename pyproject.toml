[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clm"
version = "0.1.0"
description = "Self-hosted certificate lifecycle management"
requires-python = ">=3.11"
dependencies = ["cryptography==46.0.3", "PyYAML==6.0.3", "idna==3.11"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
