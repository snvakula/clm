[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clm"
version = "0.1.0"
description = "Self-hosted certificate lifecycle management"
requires-python = ">=3.11"
dependencies = ["cryptography==48.0.0", "PyYAML==6.0.3", "idna==3.15"]

[project.scripts]
clm = "clm_server.cli:main"
clmd = "clm_server.api:main"
clm-client = "clm_client.cli:main"

[project.optional-dependencies]
server = ["fastapi==0.136.3", "uvicorn==0.49.0"]
dev = ["pytest==9.0.3", "ruff==0.15.15", "httpx==0.28.1", "pip-audit==2.10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
