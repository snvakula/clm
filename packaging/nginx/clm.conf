# Edit the hostname, TLS paths and network rules before enabling this site.
limit_req_zone $binary_remote_addr zone=clm_requests:10m rate=20r/s;
upstream clm_distribution {
    server unix:/opt/clm/run/clmd.sock;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clm.example.com;

    ssl_certificate /path/to/clm-https-fullchain.pem;
    ssl_certificate_key /path/to/clm-https-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    autoindex off;
    server_tokens off;
    access_log off;

    location /v1/ {
        # Add deployment-specific allow rules here before deny all.
        deny all;
        limit_except GET { deny all; }
        limit_req zone=clm_requests burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://clm_distribution;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-CLM-Source $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;
        proxy_cache off;
    }

    location / { return 404; }
}
